server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hrms-backend
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hrms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      timeout: 3000ms
  # 简历图片/PDF 上传（默认单文件 1MB 不够用，这里放宽到 10MB）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有数据的库首次接入：自动打 baseline=1 跳过 V1；全新空库则完整执行 V1 建库
    baseline-on-migrate: true
    baseline-version: 1

# 业务配置
hrms:
  # 登出 token 黑名单实现：redis（默认，集中式）/ memory（无 Redis 环境兜底）
  token-blacklist: redis
  # 简历等附件存放目录：相对 hrms-backend 运行目录，可用绝对路径覆盖
  # 文件不入库、不进 Git，库里只存相对路径
  upload:
    dir: ./uploads

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hrms.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: hrms-secret-key-2024-smart-hr-system
  expiration: 86400000
  header: Authorization
  prefix: Bearer

# AI模型配置 - 支持任何OpenAI兼容的API
ai:
  enabled: true
  api-key: sk-e635803bbed5433ba753d729c3b6f641
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat
  max-tokens: 2000
  temperature: 0.7
