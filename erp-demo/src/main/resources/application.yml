server:
  port: 8090
  error:
    include-message: always

spring:
  application:
    name: erp-demo
  datasource:
    url: jdbc:h2:mem:erpdemo;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  task:
    scheduling:
      enabled: true
  jackson:
    time-zone: Asia/Shanghai

hrms:
  push:
    base-url: ${HRMS_BASE_URL:http://localhost:8080/api}
    # 开放接口 Key 只从环境变量读取；未配置时推送任务自动跳过，避免密钥进仓库
    api-key: ${HRMS_API_KEY:}

erp:
  import:
    # 相对路径基于启动目录（run-erp.ps1 会切到 erp-demo 目录）
    dir: ${ERP_IMPORT_DIR:./inbox}
    auto-confirm: true
    interval-ms: 10000

logging:
  level:
    com.erpdemo: INFO
